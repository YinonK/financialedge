<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>FinancialEdge — Portfolio</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<div class="app-shell">
  <div class="sidebar" id="sidebar"></div>
  <div class="main">
    <h1>Portfolio</h1>
    <p class="subtitle">Up to 5 concentrated positions. Live P&L in USD + ILS. Stop/target zone per position.</p>

    <div class="card">
      <h2>Add Position</h2>
      <div class="field-row">
        <div class="field"><label>Ticker</label><input id="f-ticker" placeholder="NVDA" /></div>
        <div class="field"><label>Side</label>
          <select id="f-side"><option value="long">Long</option><option value="short">Short</option></select>
        </div>
        <div class="field"><label>Shares</label><input id="f-shares" type="number" placeholder="100" /></div>
      </div>
      <div class="field-row">
        <div class="field"><label>Entry price</label><input id="f-entry" type="number" step="0.01" placeholder="120.50" /></div>
        <div class="field"><label>Stop price</label><input id="f-stop" type="number" step="0.01" placeholder="110.00" /></div>
        <div class="field"><label>Target price</label><input id="f-target" type="number" step="0.01" placeholder="145.00" /></div>
      </div>
      <div class="field"><label>Thesis (why this trade)</label><textarea id="f-thesis" rows="2" placeholder="What's the setup?"></textarea></div>
      <button class="btn" onclick="addPosition()">Add position</button>
      <span id="capacityNote" class="dim" style="margin-left:12px;font-size:12px;"></span>
    </div>

    <div class="card">
      <h2>Open Positions</h2>
      <div id="positionsList" class="empty-state">Loading…</div>
    </div>
  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/shared.js"></script>
<script src="/js/portfolio.js"></script>
</body>
</html>
