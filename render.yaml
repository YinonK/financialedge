services:
  - type: web
    name: financialedge
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: AI_CHAIR
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: TELEGRAM_API_ID
        sync: false
      - key: TELEGRAM_API_HASH
        sync: false
      - key: TELEGRAM_SESSION
        sync: false
      - key: TELEGRAM_CHANNELS
        sync: false
      - key: CRON_KEY
        sync: false
      - key: APP_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: PORT
        value: 3000
# NOTE: Render's free tier has no persistent disk, so data/context.json resets
# on every redeploy. That is why durable state lives in Supabase (set
# SUPABASE_URL + SUPABASE_SERVICE_KEY); the local file is only a dev backend
# and a fallback if a Supabase write fails.
#
# APP_KEY locks every user-facing API route. Leave it unset and anyone with the
# URL can read the portfolio, spend your model credits, and delete data.
